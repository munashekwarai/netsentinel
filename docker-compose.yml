services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NETSENTINEL_DB: /data/netsentinel.db
      LOG_LEVEL: INFO
    volumes:
      - netsentinel_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  netsentinel_data:
